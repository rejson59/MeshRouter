name: Publish MeshRouter website

on:
  push:
    branches:
      # Arena tracks this session's work on this branch. The published Pages
      # site is built from it; no branch switch or gh-pages branch is needed.
      - arena/b8909b4b-meshrouter
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: meshrouter-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Test and build website with real browser demo
        run: |
          npm ci
          npm test
          npm run build:site
      - name: Keep a downloadable copy of the website
        uses: actions/upload-artifact@v6
        with:
          name: MeshRouter-website-static
          path: site-dist
          if-no-files-found: error
          retention-days: 14
      - name: Check Pages settings
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || true)
          if [[ "$build_type" == "workflow" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::GitHub Pages needs to be enabled once in Settings → Pages → Build and deployment: GitHub Actions. The website artifact has been built, but no public deployment was attempted.'
            echo 'Enable Pages with source GitHub Actions, then push to this branch to deploy.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site-dist
      - name: Publish to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
