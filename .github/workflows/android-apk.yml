name: Build Android APK

on:
  push:
    branches:
      - arena/b8909b4b-meshrouter
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install dependencies and test JavaScript
        run: |
          npm ci
          npm test
      - name: Bundle web UI into Android
        run: npm run cap:sync
      - name: Install Android SDK 34
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Assemble installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeshRouter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
