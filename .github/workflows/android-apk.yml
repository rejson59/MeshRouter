name: Build Android APK

on:
  push:
    branches:
      - arena/b8909b4b-meshrouter
      - main
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Opublikuj testowy APK jako GitHub prerelease'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    # This image includes Android SDK 34 and build-tools 34.0.0.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # SDK 34 is preinstalled on ubuntu-24.04; Gradle locates it via ANDROID_HOME.
      - name: Install dependencies and test JavaScript
        run: |
          npm ci
          npm test
      - name: Bundle web UI into Android
        run: npm run cap:sync
      - name: Assemble installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeshRouter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MeshRouter-debug-apk
          path: apk
      - name: Publish clearly labelled preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv apk/app-debug.apk apk/MeshRouter-debug.apk
          if gh release view v0.1.0-preview >/dev/null 2>&1; then
            gh release upload v0.1.0-preview apk/MeshRouter-debug.apk --clobber
          else
            gh release create v0.1.0-preview apk/MeshRouter-debug.apk \
              --target "$GITHUB_SHA" \
              --title 'MeshRouter 0.1.0 — testowy APK Android' \
              --notes 'Wersja testowa Android 8.0+. Lokalna sieć Wi-Fi, prawdziwe parametry telefonów i test przekazania danych między urządzeniami. NIE jest to otwarty hotspot ani ogólnosystemowe łączenie łączy; niezweryfikowane jeszcze na dwóch fizycznych telefonach. APK ma tymczasowy podpis debugowy — przed instalacją nowego buildu może być konieczne odinstalowanie starego.' \
              --prerelease
          fi
