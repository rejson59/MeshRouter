name: Build Android APK

on:
  push:
    branches:
      - arena/b8909b4b-meshrouter
      - main
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Opublikuj testowy APK jako GitHub prerelease'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    # This image includes Android SDK 34 and build-tools 34.0.0.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # SDK 34 is preinstalled on ubuntu-24.04; Gradle locates it via ANDROID_HOME.
      - name: Install dependencies and test JavaScript
        run: |
          npm ci
          npm test
      - name: Bundle web UI into Android
        run: npm run cap:sync
      - name: Test range scheduling and assemble installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          # Surface compile/test errors as check annotations, in addition to
          # logs (which are not always accessible through API integrations).
          if ! ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee /tmp/meshrouter-gradle.log; then
            grep -E 'error:|FAILURE:|What went wrong:|Compilation failed|There were failing tests|^> Task .* FAILED|^\* ' /tmp/meshrouter-gradle.log | tail -n 35 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: MeshRouter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    # Local GitHub integration may not have actions:write (workflow_dispatch).
    # The explicit marker on a branch commit is an alternative one-time publish trigger.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_preview) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-preview]'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: MeshRouter-debug-apk
          path: apk
      - name: Publish clearly labelled preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv apk/app-debug.apk apk/MeshRouter-debug.apk
          if gh release view v0.2.0-preview >/dev/null 2>&1; then
            gh release upload v0.2.0-preview apk/MeshRouter-debug.apk --clobber
          else
            gh release create v0.2.0-preview apk/MeshRouter-debug.apk \
              --target "$GITHUB_SHA" \
              --title 'MeshRouter 0.2.0 — wspólne pobieranie (testowy APK)' \
              --notes 'Android 8.0+. Pobieranie publicznych plików HTTPS Range (do 32 MiB) w częściach przez osobne łącza komórkowe telefonów, składanie i SHA-256 u hosta. Każdy uczestnik, również host, włącza osobną zgodę i limit pobranych bajtów. Ta funkcja nie jest ogólnosystemowym bondingiem/VPN. Automatyczne testy przeszły, ale połączenie na dwóch fizycznych telefonach i zgodność serwerów Range nie zostały jeszcze potwierdzone. APK debug ma tymczasowy podpis; aktualizacja poprzedniego buildu może wymagać odinstalowania starego.' \
              --prerelease
          fi
