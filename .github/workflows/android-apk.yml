name: Build Android APK

on:
  push:
    branches:
      - arena/b8909b4b-meshrouter
      - main
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Opublikuj testowy APK jako GitHub prerelease'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    # This image includes Android SDK 34 and build-tools 34.0.0.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # SDK 34 is preinstalled on ubuntu-24.04; Gradle locates it via ANDROID_HOME.
      - name: Install dependencies and test JavaScript
        run: |
          npm ci
          npm test
      - name: Bundle web UI into Android
        run: npm run cap:sync
      - name: Test range scheduling and assemble installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          # Surface compile/test errors as check annotations, in addition to
          # logs (which are not always accessible through API integrations).
          # Repeat JVM tests to expose intermittent concurrency failures.
          for attempt in 1 2 3 4 5 6; do
            echo "JVM test pass $attempt/6"
            if ./gradlew --no-daemon --rerun-tasks :app:testDebugUnitTest 2>&1 | tee /tmp/meshrouter-gradle.log; then
              continue
            fi
            # The Gradle XML reports contain the failing test names even if
            # the remote log archive is inaccessible to API clients.
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(path).getroot()
              for test in root.iter('testcase'):
                  for failure in list(test):
                      if failure.tag not in ('failure', 'error'): continue
                      name = f"{test.get('classname')}.{test.get('name')}"
                      detail = (failure.get('message') or failure.text or 'test failed').strip().splitlines()[0]
                      detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error title={name}::{detail[:500]}")
          PY
            grep -E 'error:|FAILURE:|What went wrong:|Compilation failed|There were failing tests|^> Task .* FAILED|^\* ' /tmp/meshrouter-gradle.log | tail -n 35 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          done
          ./gradlew --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: MeshRouter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    # Local GitHub integration may not have actions:write (workflow_dispatch).
    # The explicit marker on a branch commit is an alternative one-time publish trigger.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_preview) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-preview]'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: MeshRouter-debug-apk
          path: apk
      - name: Publish clearly labelled preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv apk/app-debug.apk apk/MeshRouter-debug.apk
          if gh release view v0.2.1-preview >/dev/null 2>&1; then
            echo '::error::Release v0.2.1-preview already exists; do not replace a published APK.'
            exit 1
          fi
          gh release create v0.2.1-preview apk/MeshRouter-debug.apk \
            --target "$GITHUB_SHA" \
            --title 'MeshRouter 0.2.1 — równoległe fragmenty (testowy APK)' \
            --notes 'Android 8.0+. Poprawiono wyścig przy przydziale początkowych fragmentów: każde wybrane łącze otrzymuje fragment przed startem wątków. Pobieranie publicznych plików HTTPS Range (do 32 MiB) przez komórkowe łącza telefonów, składanie i SHA-256 u hosta. Każdy użyty telefon, również host, włącza osobną zgodę i limit bajtów treści (bez narzutu TLS/operatora). To nie jest ogólnosystemowy bonding/VPN. Automatyczne testy przeszły, lecz transfer na dwóch fizycznych telefonach wciąż wymaga sprawdzenia. APK debug ma tymczasowy podpis; przed instalacją nowego buildu może być konieczne odinstalowanie starego.' \
            --prerelease
